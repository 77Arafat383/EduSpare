<body class="bg-background text-on-surface font-body-md h-screen flex flex-col overflow-hidden">
<!-- Header (Contextual TopAppBar for Chat) -->
<header class="bg-surface-container-lowest border-b border-outline-variant flex items-center justify-between px-margin-mobile py-sm z-10 shrink-0">
<div class="flex items-center gap-md">
<button class="text-on-surface-variant hover:text-primary transition-colors p-sm rounded-full hover:bg-surface-container-low active:scale-95 duration-100 flex items-center justify-center">

</button>
<div class="flex items-center gap-sm">
<div class="relative">
<img class="w-10 h-10 rounded-full object-cover border border-outline-variant" data-alt="A professional headshot of a young woman named Sarah Jenkins, looking friendly and approachable, set against a clean, modern white background in a well-lit studio. She wears subtle, minimalist corporate attire, fitting a light-mode productivity app aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAfv-WdcbspuGt4UnpYLgOrYaWl6NKDJnwnzj98yLYb9qeaGGenEqobNw4Ug4ZYoejVch3_28CS6NS9CB0N_9_zx3maT2mRp7tUH2NfaPy68_tMVNbhHz6Ii4xs582AaCAr_m_i_9lldgmk8ZCJNpTEHu8XlnV9UpNUDYEUhJLYbLRb1nkt3O6qOUtomvXOb4CdOhUvXgvzHsAh4f6R1GtgJwyDUc6wLvIKyaV4kDeJcSyUCHviXHFi"/>
<span class="absolute bottom-0 right-0 w-3 h-3 bg-[#10B981] border-2 border-surface-container-lowest rounded-full"></span>
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface leading-tight">Sarah Jenkins</span>
<span class="font-label-sm text-label-sm text-secondary leading-tight">Online</span>
</div>
</div>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors p-sm rounded-full hover:bg-surface-container-low active:scale-95 duration-100 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Chat Area -->
<main class="flex-1 overflow-y-auto p-margin-mobile flex flex-col gap-lg bg-surface">
<!-- Date Divider -->
<div class="flex justify-center my-sm">
<span class="bg-surface-container-highest text-on-surface-variant font-label-sm text-label-sm px-md py-xs rounded-full">Today</span>
</div>
<!-- Recipient Message (Left) -->
<div class="flex flex-col items-start gap-xs max-w-[85%]">
<div class="bg-surface-container text-on-surface px-md py-sm rounded-2xl rounded-tl-sm border border-outline-variant/30 shadow-sm">
<p class="font-body-md text-body-md">Hi! I've finished the initial wireframes for the AI Tutor interface.</p>
</div>
<span class="font-label-sm text-label-sm text-secondary px-xs">10:42 AM</span>
</div>
<!-- Sender Message (Right) -->
<div class="flex flex-col items-end gap-xs max-w-[85%] self-end">
<div class="bg-primary text-on-primary px-md py-sm rounded-2xl rounded-tr-sm shadow-sm flex items-center gap-sm">
<p class="font-body-md text-body-md">That's great! Can you share them here?</p>
</div>
<div class="flex items-center gap-xs px-xs">
<span class="font-label-sm text-label-sm text-secondary">10:45 AM</span>
<span class="material-symbols-outlined text-primary text-[16px]" data-icon="done_all" style="font-variation-settings: 'FILL' 1;">done_all</span>
</div>
</div>
<!-- Recipient Message with Image (Left) -->
<div class="flex flex-col items-start gap-xs max-w-[85%]">
<div class="bg-surface-container text-on-surface px-md py-sm rounded-2xl rounded-tl-sm border border-outline-variant/30 shadow-sm">
<p class="font-body-md text-body-md mb-md">Sure, sending them over now...</p>
<div class="rounded-xl overflow-hidden border border-outline-variant">

</div>
</div>

</div>
<!-- Recipient Message (Left) -->
<div class="flex flex-col items-start gap-xs max-w-[85%]">
<div class="bg-surface-container text-on-surface px-md py-sm rounded-2xl rounded-tl-sm border border-outline-variant/30 shadow-sm">
<p class="font-body-md text-body-md">Let me know what you think about the placement of the chat box.</p>
</div>
<span class="font-label-sm text-label-sm text-secondary px-xs">10:47 AM</span>
</div>
</main>

<footer class="bg-surface-container-lowest border-t border-outline-variant p-sm shrink-0 flex items-end gap-sm pb-safe">
<button class="text-secondary hover:text-primary transition-colors p-sm rounded-full mb-1 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
</button>
<div class="flex-1 bg-surface-container-low rounded-2xl border border-outline-variant focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all flex items-center px-md py-[10px] min-h-[44px]">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface placeholder-secondary resize-none outline-none" placeholder="Type a message..." type="text"/>
</div>
<button class="bg-primary text-on-primary hover:bg-primary-fixed-variant transition-colors p-[10px] rounded-full mb-1 flex items-center justify-center shrink-0 active:scale-95 duration-100 shadow-sm">
<span class="material-symbols-outlined" data-icon="send" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</footer>
